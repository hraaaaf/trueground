name: LOT 10 System Safety

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        run: |
          dart format lib test
          git diff --exit-code

      - name: Static analysis
        run: flutter analyze

      - name: LOT10 contract and blocker guard
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/ocd/lots/LOT_10_SYSTEM_SAFETY_CONTRACT.md
          test -f docs/ocd/evals/LOT_10_SYSTEM_SAFETY_EVAL_CASES.md
          test -f docs/ocd/evals/LOT_10_SYSTEM_SAFETY_COVERAGE_MATRIX.md
          test -f docs/ocd/evals/LOT_10_KNOWN_FAILURE_REGISTER.md
          grep -q 'KF-01' docs/ocd/lots/LOT_10_SYSTEM_SAFETY_CONTRACT.md
          grep -q 'GATE 10 BLOCKED' docs/ocd/evals/LOT_10_KNOWN_FAILURE_REGISTER.md
          grep -q 'English + French' docs/ocd/lots/LOT_10_SYSTEM_SAFETY_CONTRACT.md
          test -f lib/localization/trueground_locale.dart
          test -f docs/ocd/reviews/FR_LOCALIZATION_WORDING_REVIEW.md
          if grep -Ei 'openai|anthropic|gemini|google_generative_ai|firebase_ai' pubspec.yaml; then
            echo 'Unapproved AI/provider dependency found.'
            exit 1
          fi

      - name: Focused LOT10 system safety tests
        run: flutter test test/system_safety_test.dart test/localization_test.dart

      - name: Full widget and accessibility regression
        run: flutter test

      - name: Release web build
        run: flutter build web --release

      - name: Capture French web visual evidence
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/web/index.html")
          html = p.read_text()
          injection = """<script>
          localStorage.setItem('flutter.trueground.language.v1', JSON.stringify('fr'));
          </script>"""
          html = html.replace("</head>", injection + "\n</head>", 1)
          p.write_text(html)
          PY

          python3 -m http.server 7358 --bind 127.0.0.1 --directory build/web > /tmp/trueground-fr-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          booted=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:7358/ > /tmp/trueground-fr-index.html; then
              booted=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/trueground-fr-web.log
              exit 1
            fi
            sleep 1
          done

          if [ "$booted" -ne 1 ]; then
            cat /tmp/trueground-fr-web.log
            exit 1
          fi

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo 'No headless Chrome/Chromium binary found on runner.'
            exit 1
          fi

          mkdir -p build/fr/web-screenshots

          timeout 45s "$chrome_bin"             --headless             --disable-gpu             --no-sandbox             --hide-scrollbars             --force-device-scale-factor=1             --run-all-compositor-stages-before-draw             --virtual-time-budget=5000             --window-size=360,800             --screenshot=build/fr/web-screenshots/fr_dashboard_360_web.png             http://127.0.0.1:7358/

          timeout 45s "$chrome_bin"             --headless             --disable-gpu             --no-sandbox             --hide-scrollbars             --force-device-scale-factor=1             --run-all-compositor-stages-before-draw             --virtual-time-budget=5000             --window-size=390,844             --screenshot=build/fr/web-screenshots/fr_dashboard_390_web.png             http://127.0.0.1:7358/

          test -s build/fr/web-screenshots/fr_dashboard_360_web.png
          test -s build/fr/web-screenshots/fr_dashboard_390_web.png
          file build/fr/web-screenshots/fr_dashboard_360_web.png build/fr/web-screenshots/fr_dashboard_390_web.png

      - name: Capture urgent support visual evidence
        run: flutter test test/urgent_support_visual_evidence.dart

      - name: Capture French localization visual evidence
        run: flutter test test/fr_localization_visual_evidence.dart

      - name: Upload LOT 10 visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot10-system-safety-evidence
          path: |
            build/lot10/screenshots/
            build/fr/screenshots/
            build/fr/web-screenshots/
          if-no-files-found: warn
          retention-days: 14
