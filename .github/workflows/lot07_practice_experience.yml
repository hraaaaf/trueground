name: LOT 07 Practice Experience

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        run: |
          dart format lib test
          git diff --exit-code

      - name: Static analysis
        run: flutter analyze

      - name: Practice isolation and data-flow guard
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -E 'openai|anthropic|gemini|firebase|supabase|sqflite|hive|isar' lib/practice pubspec.yaml; then
            echo 'Forbidden provider/database dependency marker found in LOT07 scope.'
            exit 1
          fi

          if grep -R -n -E 'shared_preferences' lib/practice pubspec.yaml \
            | grep -v -E 'practice_completion_store.dart|pubspec.yaml'; then
            echo 'shared_preferences escaped the approved LOT07C completion-store boundary.'
            exit 1
          fi

          if grep -R -n -E 'clinically proven|treats OCD|your anxiety should go down|nothing bad will happen|prescribed for you|you successfully prevented' lib/practice; then
            echo 'Unsupported clinical/reassurance claim found in Practice.'
            exit 1
          fi

          if grep -R -n -E 'Timer\(|LinearProgressIndicator|CircularProgressIndicator' lib/practice; then
            echo 'Timer/progress mechanic found in Practice.'
            exit 1
          fi

      - name: Focused Practice tests
        run: flutter test test/practice_experience_test.dart

      - name: Full widget and accessibility regression
        run: flutter test

      - name: Release web build
        run: flutter build web --release

      - name: Capture before and after Practice route
        shell: bash
        run: |
          set -euo pipefail

          before_dir=/tmp/trueground-lot07-before
          rm -rf "$before_dir"
          git worktree add "$before_dir" 3a453ea7d5df6f1eb696b535ab5ca7762e4b0f1c

          cleanup() {
            kill "${after_pid:-}" >/dev/null 2>&1 || true
            kill "${before_pid:-}" >/dev/null 2>&1 || true
            git worktree remove --force "$before_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          (
            cd "$before_dir"
            flutter pub get
            flutter build web --release
          )

          python3 -m http.server 7357 --bind 127.0.0.1 --directory build/web > /tmp/lot07-after-web.log 2>&1 &
          after_pid=$!

          python3 -m http.server 7358 --bind 127.0.0.1 --directory "$before_dir/build/web" > /tmp/lot07-before-web.log 2>&1 &
          before_pid=$!

          for port in 7357 7358; do
            booted=0
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/" >/dev/null; then
                booted=1
                break
              fi
              sleep 1
            done
            if [ "$booted" -ne 1 ]; then
              cat /tmp/lot07-after-web.log || true
              cat /tmp/lot07-before-web.log || true
              exit 1
            fi
          done

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo 'No headless Chrome/Chromium binary found on runner.'
            exit 1
          fi

          mkdir -p build/lot07/screenshots

          for spec in "360 800" "390 844"; do
            set -- $spec
            width=$1
            height=$2

            timeout 45s "$chrome_bin" \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=5000 \
              --window-size="$width,$height" \
              --screenshot="build/lot07/screenshots/before_practice_${width}.png" \
              "http://127.0.0.1:7358/#/practice"

            timeout 45s "$chrome_bin" \
              --headless \
              --disable-gpu \
              --no-sandbox \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=5000 \
              --window-size="$width,$height" \
              --screenshot="build/lot07/screenshots/after_practice_${width}.png" \
              "http://127.0.0.1:7357/#/practice"
          done

          test -s build/lot07/screenshots/before_practice_360.png
          test -s build/lot07/screenshots/after_practice_360.png
          test -s build/lot07/screenshots/before_practice_390.png
          test -s build/lot07/screenshots/after_practice_390.png

          sha256sum build/lot07/screenshots/before_practice_*.png
          sha256sum build/lot07/screenshots/after_practice_*.png

      - name: Capture Practice state visual evidence
        run: |
          flutter test test/practice_visual_evidence.dart
          test -s build/lot07/screenshots/practice_360_menu_widget.png
          test -s build/lot07/screenshots/practice_360_pause_widget.png
          test -s build/lot07/screenshots/practice_360_uncertainty_widget.png
          test -s build/lot07/screenshots/practice_360_planned_empty_widget.png
          test -s build/lot07/screenshots/practice_390_menu_widget.png
          test -s build/lot07/screenshots/practice_390_pause_widget.png
          test -s build/lot07/screenshots/practice_390_uncertainty_widget.png
          test -s build/lot07/screenshots/practice_390_planned_empty_widget.png
          sha256sum build/lot07/screenshots/*_widget.png

      - name: Upload LOT 07 visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot07-practice-evidence
          path: build/lot07/screenshots/
          if-no-files-found: warn
          retention-days: 14
