name: TEMP target clone formatter

on:
  push:
    branches:
      - lot/04d-dashboard-target-first

permissions:
  contents: write

jobs:
  format-target-clone:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lot/04d-dashboard-target-first
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Normalize target copy
        run: python3 .github/scripts/format_target_clone.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format product files
        run: dart format lib/dashboard/dashboard_v3_screen.dart lib/shell/app_shell.dart lib/design/app_theme.dart
      - name: Commit formatted product files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dashboard/dashboard_v3_screen.dart lib/shell/app_shell.dart lib/design/app_theme.dart
          if git diff --cached --quiet; then
            echo "No formatted product changes to commit"
          else
            git commit -m "style: normalize target clone implementation"
            git push origin HEAD:lot/04d-dashboard-target-first
          fi
