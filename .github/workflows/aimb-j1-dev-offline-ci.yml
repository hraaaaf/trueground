name: AIMB J1-DEV isolated offline Windows validation
on:
  push:
    branches: [chore/aimb-g1-g3-windows-ci-20261112]
    paths:
      - 'engineering/aimb-j1-dev/**'
      - '.github/workflows/aimb-j1-dev-offline-ci.yml'
  workflow_dispatch:
    branches: [chore/aimb-g1-g3-windows-ci-20261112]
permissions:
  contents: read
concurrency:
  group: aimb-j1-dev-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-offline:
    if: github.ref == 'refs/heads/chore/aimb-g1-g3-windows-ci-20261112'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Reject secret files and private-key content
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'engineering/aimb-j1-dev'
          $files = Get-ChildItem $root -Recurse -File
          foreach ($f in $files) {
            if ($f.Name -match '(?i)^(id_rsa|id_ed25519|credentials\.json|\.env.*)$|\.(pem|p12|pfx|key)$') { throw 'PROHIBITED_CREDENTIAL_FILENAME' }
            if ($f.Length -gt 1MB) { throw 'UNREVIEWED_LARGE_FILE' }
            if ($f.Extension -in @('.js','.mjs','.cjs','.md','.ps1','.json','.yml','.yaml')) {
              if (Select-String -LiteralPath $f.FullName -Pattern '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -Quiet) { throw 'PRIVATE_KEY_MARKER_FOUND' }
            }
          }
          Write-Host "Credential filename and private-key marker checks passed for $($files.Count) files"
      - name: Verify SHA-256 manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'engineering/aimb-j1-dev').Path
          $manifest = Join-Path $root 'SHA256SUMS.txt'
          foreach ($line in Get-Content $manifest) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9_./-]+)$') { throw 'SHA256_MANIFEST_FORMAT_INVALID' }
            $expected = $Matches[1]
            $relative = $Matches[2]
            $path = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'SHA256_FILE_MISSING' }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA256_MISMATCH $relative expected=$expected actual=$actual" }
          }
          Write-Host 'Export SHA-256 manifest verified'
      - name: Syntax check all JavaScript
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem engineering/aimb-j1-dev -Recurse -File | Where-Object { $_.Extension -in @('.js','.mjs','.cjs') }
          foreach ($f in $files) { node --check $f.FullName; if ($LASTEXITCODE -ne 0) { throw 'NODE_SYNTAX_FAILED' } }
          Write-Host "Syntax passed: $($files.Count) files"
      - name: Run offline Node and Win32 mock suite
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location engineering/aimb-j1-dev
          try {
            $tests = Get-ChildItem -Recurse -Filter '*.test.mjs' | ForEach-Object { $_.FullName }
            node --test --test-reporter=spec @tests
            if ($LASTEXITCODE -ne 0) { throw 'NODE_TESTS_FAILED' }
          } finally { Pop-Location }
      - name: Run native PowerShell 7 Win32 adversarial tests
        run: |
          pwsh -NoProfile -NonInteractive -File engineering/aimb-j1-dev/native-read-gate.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'POWERSHELL_7_TESTS_FAILED' }
      - name: Run Windows PowerShell 5.1 Win32 adversarial tests
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File engineering/aimb-j1-dev/native-read-gate.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'POWERSHELL_51_TESTS_FAILED' }
