name: AIMB J4 patch-envelope offline CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'engineering/aimb-j4/patch-envelope-v1/**'
      - '.github/workflows/aimb-j4-patch-envelope-ci.yml'
  push:
    branches:
      - 'feat/aimb-j4-patch-envelope-v1-20261114'
    paths:
      - 'engineering/aimb-j4/patch-envelope-v1/**'
      - '.github/workflows/aimb-j4-patch-envelope-ci.yml'

permissions:
  contents: read

concurrency:
  group: aimb-j4-envelope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline validator / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        shell: bash
        run: |
          node --check engineering/aimb-j4/patch-envelope-v1/patch-envelope.mjs
          node --check engineering/aimb-j4/patch-envelope-v1/patch-envelope.test.mjs
      - name: Run offline negative and positive tests
        run: node --test engineering/aimb-j4/patch-envelope-v1/patch-envelope.test.mjs
      - name: State limits
        if: always()
        run: echo "Offline cryptographic validation only; no MCP, Worker, D1, filesystem mutation, Windows installation, merge, or deployment"
