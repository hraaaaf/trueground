name: LOT 04 format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false
      - name: Emit exact formatter patch
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/dashboard/dashboard_v3_screen.dart test/dashboard_v3_test.dart
          git diff -- lib/dashboard/dashboard_v3_screen.dart test/dashboard_v3_test.dart
