name: LOT11-D Hardening Format Probe

on:
  pull_request:
    branches:
      - lot/11c-provider-benchmark

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Show canonical hardening format diff
        shell: bash
        run: |
          set -euo pipefail
          dart format             lib/conversation/conversation_output_guard.dart             test/lot11d_conversation_runtime_test.dart
          git diff --             lib/conversation/conversation_output_guard.dart             test/lot11d_conversation_runtime_test.dart
