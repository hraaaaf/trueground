name: LOT 04B dead-param cleanup

on:
  push:
    branches:
      - lot/04b-dashboard-v3-visual-fidelity

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lot/04b-dashboard-v3-visual-fidelity

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Remove unused RoundIcon parameter and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/dashboard/dashboard_v3_screen.dart')
          text = path.read_text()
          replacements = {
              "  const _RoundIcon({\n    required this.icon,\n    this.small = false,\n    this.compact = false,\n  });": "  const _RoundIcon({required this.icon, this.compact = false});",
              "  final bool small;\n  final bool compact;": "  final bool compact;",
              "    final size = compact ? 38.0 : (small ? 38.0 : 44.0);": "    final size = compact ? 38.0 : 44.0;",
              "        size: compact ? 21 : (small ? 22 : 24),": "        size: compact ? 21 : 24,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart format lib/dashboard/dashboard_v3_screen.dart

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/dashboard/dashboard_v3_screen.dart; then
            echo 'No cleanup diff produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard/dashboard_v3_screen.dart
          git commit -m 'fix: remove unused LOT 04B icon parameter'
          git push origin HEAD:lot/04b-dashboard-v3-visual-fidelity
