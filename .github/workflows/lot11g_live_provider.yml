name: LOT 11G Live Provider System Gate

on:
  push:
    branches:
      - lot/11g-prehuman-validation
    paths:
      - tool/lot11g/LIVE_PROVIDER_TRIGGER_20261002.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lot11g-live-provider
  cancel-in-progress: false

jobs:
  preflight-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Exact-head quota-free preflight
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/conversation/conversation_runtime.dart \
            lib/conversation/conversation_server_adapter.dart \
            lib/conversation/conversation_safety_policy.dart \
            lib/conversation/conversation_output_guard.dart \
            lib/conversation/conversation_screen.dart \
            lib/dashboard/dashboard_v3_screen.dart \
            lib/localization/trueground_locale.dart \
            test/lot11e_conversation_ux_test.dart \
            test/lot11e_conversation_visual_evidence.dart \
            test/lot11f_live_provider_boundary_test.dart \
            test/lot11g_anti_dependency_ux_test.dart \
            test/lot11g_live_provider_system_test.dart \
            test/lot11g_pre_human_adversarial_test.dart
          git diff --exit-code
          node --check api/conversation.mjs
          node --check tool/lot11g/server_contract_characterization.mjs
          node --check tool/lot11g/live_provider_local_server.mjs
          flutter analyze
          node tool/lot11g/server_contract_characterization.mjs
          flutter test test/lot11g_pre_human_adversarial_test.dart
          flutter test test/lot11g_anti_dependency_ux_test.dart
          flutter test \
            test/lot11d_conversation_runtime_test.dart \
            test/lot11e_conversation_ux_test.dart \
            test/lot11f_live_provider_boundary_test.dart \
            test/lot11f_adversarial_safety_test.dart
          flutter test

      - name: Check live provider secret presence only
        env:
          Llm_Key: ${{ secrets.Grok_key_secret }}
        shell: bash
        run: test -n "${Llm_Key:-}"

      - name: Run exactly 12 live provider calls through full system path
        env:
          Llm_Key: ${{ secrets.Grok_key_secret }}
          LOT11G_LIVE_PROVIDER: "1"
          LOT11G_SERVER_URL: http://127.0.0.1:8788/api/conversation
          LOT11G_PORT: "8788"
        shell: bash
        run: |
          set -euo pipefail
          node tool/lot11g/live_provider_local_server.mjs >/tmp/lot11g-live-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          flutter test test/lot11g_live_provider_system_test.dart

      - name: Upload sanitized live metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot11g-live-provider-metrics
          path: build/lot11g/live_provider_metrics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ephemeral raw reviewer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot11g-live-provider-raw-reviewer
          path: build/lot11g/live_provider_raw_reviewer.json
          if-no-files-found: warn
          retention-days: 1

      - name: Remove ephemeral raw reviewer evidence
        if: always()
        shell: bash
        run: rm -f build/lot11g/live_provider_raw_reviewer.json
