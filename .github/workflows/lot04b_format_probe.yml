name: LOT 04B format probe

on:
  push:
    branches:
      - lot/04b-dashboard-v3-visual-fidelity

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Format dashboard source
        run: dart format lib/dashboard/dashboard_v3_screen.dart

      - name: Upload formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot04b-formatted-dashboard-source
          path: lib/dashboard/dashboard_v3_screen.dart
          if-no-files-found: error
          retention-days: 1
