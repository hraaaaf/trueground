# trigger final target tuning
name: TEMP final glass tuning

on:
  pull_request:
    branches:
      - lot/04-dashboard-v3-static

permissions:
  contents: write

jobs:
  tune-glass:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
      - name: Apply glass tuning
        run: python3 .github/scripts/tune_glass_target.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format changed files
        run: dart format lib/dashboard/dashboard_v3_screen.dart lib/shell/app_shell.dart lib/design/app_theme.dart
      - name: Commit tuned sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dashboard/dashboard_v3_screen.dart lib/shell/app_shell.dart lib/design/app_theme.dart
          if git diff --cached --quiet; then
            echo "No tuning changes to commit"
          else
            git commit -m "style: tune glass fidelity to approved mockup"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
