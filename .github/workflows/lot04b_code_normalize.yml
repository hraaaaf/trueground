name: LOT 04B Code Normalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false
      - name: Normalize canonical copy and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/dashboard/dashboard_v3_screen.dart')
          text = path.read_text()
          replacements = {
              "title: 'Pause\\nthe ritual',": "title: 'Pause the ritual',",
              "title: 'Practice\\nuncertainty',": "title: 'Practice uncertainty',",
              "title: 'Continue\\nplanned practice',": "title: 'Continue planned practice',",
              "title: 'Need a person,\\nnot an answer?',": "title: 'Need a person, not an answer?',",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source token: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          dart format lib/dashboard/dashboard_v3_screen.dart
          git diff --check
          git diff -- lib/dashboard/dashboard_v3_screen.dart
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/dashboard/dashboard_v3_screen.dart; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard/dashboard_v3_screen.dart
          git commit -m 'fix(lot04b): normalize target copy and formatting'
          git push origin HEAD:${{ github.head_ref }}
