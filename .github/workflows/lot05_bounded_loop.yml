name: LOT 05 Bounded Loop

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Client and provider isolation guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'diabetes|firebase|supabase|IAMINA-MVP|iamina_mvp|openai|anthropic|gemini' lib pubspec.yaml; then
            echo 'Forbidden cross-client/provider dependency marker found.'
            exit 1
          fi

      - name: Focused Loop tests
        run: flutter test test/loop_flow_policy_test.dart test/loop_flow_test.dart

      - name: Full widget and accessibility regression
        run: flutter test

      - name: Release web build
        run: flutter build web --release

      - name: Local smoke and Loop visual capture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 7357 --bind 127.0.0.1 --directory build/web > /tmp/trueground-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          booted=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:7357/ > /tmp/trueground-index.html; then
              booted=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/trueground-web.log
              exit 1
            fi
            sleep 1
          done

          if [ "$booted" -ne 1 ]; then
            cat /tmp/trueground-web.log
            exit 1
          fi

          grep -q '<script' /tmp/trueground-index.html

          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo 'No headless Chrome/Chromium binary found on runner.'
            exit 1
          fi

          mkdir -p build/lot05/screenshots

          timeout 45s "$chrome_bin"             --headless             --disable-gpu             --no-sandbox             --hide-scrollbars             --force-device-scale-factor=1             --run-all-compositor-stages-before-draw             --virtual-time-budget=5000             --window-size=360,800             --screenshot=build/lot05/screenshots/loop_360.png             http://127.0.0.1:7357/#/loop

          timeout 45s "$chrome_bin"             --headless             --disable-gpu             --no-sandbox             --hide-scrollbars             --force-device-scale-factor=1             --run-all-compositor-stages-before-draw             --virtual-time-budget=5000             --window-size=390,844             --screenshot=build/lot05/screenshots/loop_390.png             http://127.0.0.1:7357/#/loop

          test -s build/lot05/screenshots/loop_360.png
          test -s build/lot05/screenshots/loop_390.png
          file build/lot05/screenshots/loop_360.png build/lot05/screenshots/loop_390.png
          sha256sum build/lot05/screenshots/loop_360.png build/lot05/screenshots/loop_390.png
          cat /tmp/trueground-web.log

      - name: Upload LOT 05 visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot05-bounded-loop-evidence
          path: build/lot05/screenshots/
          if-no-files-found: warn
          retention-days: 14
