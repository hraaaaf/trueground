name: LOT04D text fit fix

on:
  push:
    branches:
      - lot/04d-dashboard-target-first

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lot/04d-dashboard-target-first
          fetch-depth: 0
      - name: Fix target text fit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/dashboard/dashboard_v3_screen.dart')
          s = p.read_text()

          def patch_section(text, start, end, replacements):
              before, rest = text.split(start, 1)
              body, after = rest.split(end, 1)
              for old, new in replacements:
                  if old not in body:
                      raise SystemExit(f'Missing scoped match in {start}: {old!r}')
                  body = body.replace(old, new, 1)
              return before + start + body + end + after

          s = patch_section(s, 'class _TargetCard extends StatelessWidget {', 'class _WideCard extends StatelessWidget {', [
              ('right: 8,\n              top: 55,', 'right: 16,\n              top: 55,'),
              ('fontSize: 10.8,', 'fontSize: 10.3,'),
          ])
          s = patch_section(s, 'class _WideCard extends StatelessWidget {', 'class _ReviewCard extends StatelessWidget {', [
              ('fontSize: 10.8,', 'fontSize: 9.8,'),
          ])
          p.write_text(s)
          PY
          git diff --check
          git diff -- lib/dashboard/dashboard_v3_screen.dart
      - name: Commit text fit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard/dashboard_v3_screen.dart
          git commit -m 'fix: preserve dashboard card copy fit'
          git push origin HEAD:lot/04d-dashboard-target-first
