name: LOT04D target ratio pass

on:
  push:
    branches:
      - lot/04d-dashboard-target-first

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lot/04d-dashboard-target-first
          fetch-depth: 0
      - name: Apply measured target proportions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/dashboard/dashboard_v3_screen.dart')
          s = p.read_text()
          replacements = [
              ('top: 160,\n                        height: 122,', 'top: 150,\n                        height: 102,'),
              ('top: 294,\n                        height: 198,', 'top: 272,\n                        height: 166,'),
              ('top: 504,\n                        height: 144,', 'top: 458,\n                        height: 119,'),
              ('top: 660,\n                        height: 68,', 'top: 597,\n                        height: 61,'),
              ('horizontal: 14,\n                    vertical: 14,', 'horizontal: 14,\n                    vertical: 10,'),
              ('width: 54,\n                        height: 54,', 'width: 48,\n                        height: 48,'),
              ('size: 31,', 'size: 27,'),
              ('const SizedBox(width: 13),', 'const SizedBox(width: 12),'),
              ('fontSize: 21.5,', 'fontSize: 19,'),
              ('SizedBox(height: 7),', 'SizedBox(height: 5),'),
              ('fontSize: 12.7,', 'fontSize: 11.3,'),
              ('size: 28,\n                      ),', 'size: 24,\n                      ),'),
              ('left: 12,\n              top: 13,\n              child: _RoundIcon(icon: icon, size: 44),', 'left: 12,\n              top: 10,\n              child: _RoundIcon(icon: icon, size: 36),'),
              ('top: 68,\n              height: 52,', 'top: 55,\n              height: 43,'),
              ('fontSize: 15.8,', 'fontSize: 13.2,'),
              ('top: 126,\n              height: 40,', 'top: 102,\n              height: 39,'),
              ('fontSize: 10.3,', 'fontSize: 9.8,'),
              ('bottom: 7,\n              child: Icon(\n                Icons.chevron_right_rounded,\n                size: 20,', 'bottom: 8,\n              child: Icon(\n                Icons.chevron_right_rounded,\n                size: 18,'),
              ('left: 12,\n              top: 12,\n              child: _RoundIcon(icon: icon, size: 42),', 'left: 12,\n              top: 10,\n              child: _RoundIcon(icon: icon, size: 35),'),
              ('right: 10,\n              top: 22,\n              child: Icon(\n                Icons.chevron_right_rounded,\n                size: 21,', 'right: 10,\n              top: 15,\n              child: Icon(\n                Icons.chevron_right_rounded,\n                size: 19,'),
              ('top: 62,\n              height: 38,', 'top: 52,\n              height: 30,'),
              ('fontSize: 15.2,', 'fontSize: 13.2,'),
              ('top: 105,\n              height: 30,', 'top: 84,\n              height: 28,'),
              ('padding: EdgeInsets.symmetric(horizontal: 12, vertical: 9),', 'padding: EdgeInsets.symmetric(horizontal: 12, vertical: 8),'),
              ('_RoundIcon(icon: Icons.bar_chart_rounded, size: 46),', '_RoundIcon(icon: Icons.bar_chart_rounded, size: 36),'),
              ('SizedBox(width: 12),', 'SizedBox(width: 10),'),
              ('fontSize: 16.8,', 'fontSize: 13.5,'),
              ('SizedBox(height: 5),', 'SizedBox(height: 3),'),
              ('fontSize: 11.6,', 'fontSize: 9.8,'),
              ('size: 21,\n                color: TrueGroundColors.inkMuted,', 'size: 19,\n                color: TrueGroundColors.inkMuted,'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- lib/dashboard/dashboard_v3_screen.dart
      - name: Commit ratio pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard/dashboard_v3_screen.dart
          git commit -m 'fix: match dashboard target proportions'
          git push origin HEAD:lot/04d-dashboard-target-first
