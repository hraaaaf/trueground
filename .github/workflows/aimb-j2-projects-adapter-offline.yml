name: AIMB J2 Projects adapter offline
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'engineering/aimb-j2-projects/**'
      - '.github/workflows/aimb-j2-projects-adapter-offline.yml'
  push:
    branches:
      - 'feat/aimb-j2-projects-adapter-gate-20261114'
    paths:
      - 'engineering/aimb-j2-projects/**'
      - '.github/workflows/aimb-j2-projects-adapter-offline.yml'
permissions:
  contents: read
jobs:
  windows-ps51-fixtures:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax and synthetic callback tests only
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          foreach($file in @('project-drain.ps1','project-signed-adapter.ps1','project-signed-adapter.test.ps1')){
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ("engineering/aimb-j2-projects/"+$file)).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ('Parse failed: '+$file)}
          }
          & .\engineering\aimb-j2-projects\project-drain.test.ps1
          if(-not $?){throw 'drain test failed'}
          & .\engineering\aimb-j2-projects\project-signed-adapter.test.ps1
          if(-not $?){throw 'adapter test failed'}
