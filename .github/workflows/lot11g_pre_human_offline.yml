name: LOT 11G Pre-Human Offline Gate

on:
  push:
    branches:
      - lot/11g-prehuman-validation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lot11g-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format check
        run: |
          dart format \
            lib/conversation/conversation_runtime.dart \
            lib/conversation/conversation_server_adapter.dart \
            lib/conversation/conversation_safety_policy.dart \
            lib/conversation/conversation_output_guard.dart \
            lib/conversation/conversation_screen.dart \
            lib/dashboard/dashboard_v3_screen.dart \
            lib/localization/trueground_locale.dart \
            test/lot11e_conversation_visual_evidence.dart \
            test/lot11f_live_provider_boundary_test.dart \
            test/lot11g_anti_dependency_ux_test.dart \
            test/lot11g_pre_human_adversarial_test.dart
          git diff --exit-code
      - name: Node syntax check
        run: |
          node --check api/conversation.mjs
          node --check tool/lot11g/server_contract_characterization.mjs
          node --check tool/lot11f/server_boundary_test.mjs
          node --check tool/lot11f/live_provider_smoke.mjs
      - name: Static analysis
        run: flutter analyze
      - name: Server contract characterization
        run: node tool/lot11g/server_contract_characterization.mjs
      - name: LOT11-G frozen adversarial corpus
        run: flutter test test/lot11g_pre_human_adversarial_test.dart
      - name: LOT11-G anti-dependency UX gate
        run: flutter test test/lot11g_anti_dependency_ux_test.dart
      - name: LOT11-D/E/F safety regression
        if: always()
        run: flutter test test/lot11d_conversation_runtime_test.dart test/lot11e_conversation_ux_test.dart test/lot11f_live_provider_boundary_test.dart test/lot11f_adversarial_safety_test.dart
      - name: Full Flutter regression
        if: always()
        run: flutter test
      - name: Capture LOT11-G G3 before and after evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          base_sha=f21881bef53cd952c06304f9451b08ee92279066
          before_dir=/tmp/trueground-lot11g-before
          rm -rf "$before_dir" build/lot11g/screenshots build/lot11e/screenshots
          git worktree add "$before_dir" "$base_sha"

          cleanup() {
            git worktree remove --force "$before_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          cp test/lot11e_conversation_visual_evidence.dart \
            "$before_dir/test/lot11e_conversation_visual_evidence.dart"

          (
            cd "$before_dir"
            flutter pub get
            flutter test test/lot11e_conversation_visual_evidence.dart
          )

          mkdir -p build/lot11g/screenshots
          for src in "$before_dir"/build/lot11e/screenshots/*.png; do
            cp "$src" "build/lot11g/screenshots/before_$(basename "$src")"
          done

          flutter test test/lot11e_conversation_visual_evidence.dart
          for src in build/lot11e/screenshots/*.png; do
            cp "$src" "build/lot11g/screenshots/after_$(basename "$src")"
          done

          for width in 360 390 430 768 1280; do
            test -s "build/lot11g/screenshots/before_dashboard_${width}_companion_entry.png"
            test -s "build/lot11g/screenshots/after_dashboard_${width}_companion_entry.png"
            test -s "build/lot11g/screenshots/before_conversation_${width}_idle_en.png"
            test -s "build/lot11g/screenshots/after_conversation_${width}_idle_en.png"
          done
          for width in 390 430 768; do
            test -s "build/lot11g/screenshots/before_popup_${width}_idle.png"
            test -s "build/lot11g/screenshots/after_popup_${width}_idle.png"
          done
          test -s build/lot11g/screenshots/before_conversation_360_idle_en_200pct.png
          test -s build/lot11g/screenshots/after_conversation_360_idle_en_200pct.png
          test -s build/lot11g/screenshots/before_conversation_430_idle_fr_200pct.png
          test -s build/lot11g/screenshots/after_conversation_430_idle_fr_200pct.png
          sha256sum build/lot11g/screenshots/*.png

      - name: Upload LOT11-G G3 visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot11g-g3-before-after-evidence
          path: build/lot11g/screenshots/
          if-no-files-found: error
          retention-days: 14
      - name: Verify offline gate has no provider secret
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'secrets\.' .github/workflows/lot11g_pre_human_offline.yml | grep -v 'grep -n'; then
            echo 'Provider secret wiring found in LOT11-G offline workflow.'
            exit 1
          fi
          if grep -R -n -E 'Grok_key_secret|GROQ_API_KEY|gsk_' tool/lot11g test/lot11g_pre_human_adversarial_test.dart; then
            echo 'Provider credential marker found in LOT11-G offline source.'
            exit 1
          fi
          echo 'LOT11G_OFFLINE_NO_PROVIDER_SECRET_PASS'
