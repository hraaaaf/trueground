name: LOT 04B apply formatter

on:
  push:
    branches:
      - lot/04b-dashboard-v3-visual-fidelity

permissions:
  contents: write

jobs:
  apply-format:
    if: github.event.head_commit.message != 'style: apply Flutter formatter exact output'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: lot/04b-dashboard-v3-visual-fidelity

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Apply exact formatter
        run: dart format lib/dashboard/dashboard_v3_screen.dart

      - name: Commit formatted source if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/dashboard/dashboard_v3_screen.dart; then
            echo 'Dashboard source already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard/dashboard_v3_screen.dart
          git commit -m 'style: apply Flutter formatter exact output'
          git push origin HEAD:lot/04b-dashboard-v3-visual-fidelity
