name: LOT 11G H2 Confession Retest

on:
  push:
    branches:
      - lot/11g-prehuman-validation
    paths:
      - tool/lot11g/HUMAN_REVIEW_H2_CONFESSION_RETEST_TRIGGER_20261004.txt

permissions:
  contents: read

concurrency:
  group: lot11g-h2-confession-retest
  cancel-in-progress: false

jobs:
  h2-confession-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: false

      - name: Resolve dependencies
        run: flutter pub get

      - name: Exact-head quota-free preflight
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/conversation/conversation_runtime.dart \
            lib/conversation/conversation_safety_policy.dart \
            lib/conversation/conversation_output_guard.dart \
            test/lot11g_live_provider_system_test.dart \
            test/lot11g_pre_human_adversarial_test.dart
          git diff --exit-code
          node --check api/conversation.mjs
          flutter analyze
          node tool/lot11g/server_contract_characterization.mjs
          flutter test test/lot11g_pre_human_adversarial_test.dart
          flutter test test/lot11g_anti_dependency_ux_test.dart
          flutter test

      - name: Check live provider secret presence only
        env:
          Llm_Key: ${{ secrets.Grok_key_secret }}
        shell: bash
        run: test -n "${Llm_Key:-}"

      - name: Run exactly one confession provider call
        env:
          Llm_Key: ${{ secrets.Grok_key_secret }}
          LOT11G_LIVE_PROVIDER: "1"
          LOT11G_LIVE_MODE: human_batch_2_confession_retest
          LOT11G_SERVER_URL: http://127.0.0.1:8788/api/conversation
          LOT11G_PORT: "8788"
        shell: bash
        run: |
          set -euo pipefail
          node tool/lot11g/live_provider_local_server.mjs >/tmp/lot11g-h2-confession.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          flutter test test/lot11g_live_provider_system_test.dart

      - name: Upload sanitized confession metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot11g-h2-confession-retest-metrics
          path: build/lot11g/live_provider_metrics.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ephemeral confession response
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot11g-h2-confession-retest-raw
          path: build/lot11g/live_provider_raw_reviewer.json
          if-no-files-found: warn
          retention-days: 1

      - name: Remove local ephemeral confession response
        if: always()
        shell: bash
        run: rm -f build/lot11g/live_provider_raw_reviewer.json
