name: AIMB J1-H isolated validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engineering/aimb-j1h/**'
      - '.github/workflows/aimb-j1h-ci.yml'
permissions:
  contents: read
concurrency:
  group: aimb-j1h-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch-reference:
    name: Reference patch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify byte-exact patch and scope
        run: node --test engineering/aimb-j1h/patch-integrity.test.mjs
      - name: Instructions
        run: echo "Patch-only integrity gate. Full 78 tests require adding vetted V074 source/test fixtures; NO Windows host or Cloudflare integration is exercised."
