name: LOT 04 target asset diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Recover canonical Dashboard V3 asset by expected SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path

          expected = '117f1121fa2cec0d3319d5e2c93cf514ec5f40be3a05950ed7b8b89db97210a5'
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          path = Path('docs/ocd/assets/dashboard_target_v3.jpg.b64')
          text = ''.join(path.read_text(encoding='utf-8').split())
          print(f'encoded_chars={len(text)}')
          print(f'endswith_padding={text[-4:]}')

          try:
              raw = base64.b64decode(text, validate=True)
          except Exception as exc:
              print(f'current_decode_error={exc}')
          else:
              print(f'current_sha256={hashlib.sha256(raw).hexdigest()}')
              if hashlib.sha256(raw).hexdigest() == expected:
                  Path('build/lot04').mkdir(parents=True, exist_ok=True)
                  Path('build/lot04/dashboard_target_v3.jpg').write_bytes(raw)
                  Path('build/lot04/dashboard_target_v3.jpg.b64').write_text(text + '\n', encoding='utf-8')
                  raise SystemExit(0)

          if not text.endswith('=='):
              raise SystemExit('Expected the corrupted payload to retain == padding; refusing heuristic repair.')

          data_part = text[:-2]
          if len(data_part) % 4 != 1:
              raise SystemExit(f'Unexpected data length modulo 4: {len(data_part) % 4}')

          print(f'data_chars={len(data_part)}; attempting exact single-character recovery')
          found = None
          checked = 0
          for pos in range(len(data_part) + 1):
              prefix = data_part[:pos]
              suffix = data_part[pos:]
              for ch in alphabet:
                  candidate = prefix + ch + suffix + '=='
                  checked += 1
                  try:
                      raw = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  if hashlib.sha256(raw).hexdigest() == expected:
                      found = (pos, ch, candidate, raw)
                      break
              if found:
                  break
              if pos and pos % 2500 == 0:
                  print(f'progress_positions={pos} candidates={checked}')

          if not found:
              raise SystemExit(f'No exact one-character recovery matched expected SHA after {checked} candidates.')

          pos, ch, candidate, raw = found
          out = Path('build/lot04')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'dashboard_target_v3.jpg.b64').write_text(candidate + '\n', encoding='utf-8')
          (out / 'dashboard_target_v3.jpg').write_bytes(raw)
          print(f'RECOVERED position={pos} char={ch!r} candidates={checked}')
          print(f'recovered_bytes={len(raw)}')
          print(f'recovered_sha256={hashlib.sha256(raw).hexdigest()}')
          print(f'first16={raw[:16].hex()}')
          print(f'last16={raw[-16:].hex()}')
          PY

          file build/lot04/dashboard_target_v3.jpg
          identify build/lot04/dashboard_target_v3.jpg || true

      - name: Upload recovered canonical target
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lot04-recovered-dashboard-target
          path: build/lot04/
          if-no-files-found: error
          retention-days: 14
