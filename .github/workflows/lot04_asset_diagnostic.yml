name: LOT 04 target asset diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Inspect surviving JPEG structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          text = ''.join(Path('docs/ocd/assets/dashboard_target_v3.jpg.b64').read_text(encoding='utf-8').split())
          print(f'encoded_chars={len(text)}')
          print(f'tail={text[-12:]}')
          if not text.endswith('=='):
              raise SystemExit('unexpected padding')

          data_part = text[:-2]
          print(f'data_chars={len(data_part)} mod4={len(data_part)%4}')

          probes = []
          for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/':
              candidate = data_part + ch + '=='
              try:
                  raw = base64.b64decode(candidate, validate=True)
              except Exception:
                  continue
              probes.append((ch, raw))

          if not probes:
              raise SystemExit('no decodable single-char tail completion')

          ch, raw = probes[0]
          print(f'probe_char={ch} decoded_bytes={len(raw)}')
          print(f'first64={raw[:64].hex()}')
          print(f'last64={raw[-64:].hex()}')

          markers = {
              'SOI': b'\xff\xd8',
              'EOI': b'\xff\xd9',
              'SOF0': b'\xff\xc0',
              'SOF2': b'\xff\xc2',
              'SOS': b'\xff\xda',
              'DQT': b'\xff\xdb',
              'DHT': b'\xff\xc4',
              'APP0': b'\xff\xe0',
              'APP1': b'\xff\xe1',
          }
          for name, marker in markers.items():
              positions=[]
              start=0
              while True:
                  i=raw.find(marker,start)
                  if i<0: break
                  positions.append(i)
                  start=i+1
              print(f'{name}: count={len(positions)} first={positions[:12]}')

          # Entropy-coded JPEG data commonly contains byte-stuffed FF00 sequences.
          ff00=[]
          start=0
          while True:
              i=raw.find(b'\xff\x00',start)
              if i<0: break
              ff00.append(i)
              start=i+1
          print(f'FF00_stuffed_count={len(ff00)} first={ff00[:20]}')
          PY
