name: LOT 04B Const Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
      - name: Apply exact analyzer fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/dashboard/dashboard_v3_screen.dart')
          text = path.read_text()
          old = "              const Semantics(\n                header: true,"
          new = "              Semantics(\n                header: true,"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one match, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- lib/dashboard/dashboard_v3_screen.dart
      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/dashboard/dashboard_v3_screen.dart
          git commit -m 'fix(lot04b): remove invalid const semantics invocation'
          git push origin HEAD:${{ github.head_ref }}
